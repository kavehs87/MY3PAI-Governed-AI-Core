[project]
name = "my3pai-governed-ai-core"
version = "0.2.0-beta"
description = "Deterministic, rights-aware runtime for controlled AI content workflows, verifiable provenance, and reproducible contribution accounting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "MY3PAI" }]
keywords = ["ai-governance", "provenance", "policy-gateway", "audit-trail"]
dependencies = [
    "pydantic>=2.7",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["schemas*", "src*"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C90", "PL"]
ignore = ["S101", "UP017", "UP042", "PLC0415", "S311", "S310", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "SLF001", "ARG001", "PLR0913"]
"scripts/*" = ["S101", "PLR2004", "S310"]
# Ordered rule evaluation in the gateway is intentionally linear: each
# terminal rule returns immediately so audit order is unambiguous.
"src/policy/gateway.py" = ["C901", "PLR0911", "PLR0912"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=schemas --cov=src --cov-report=term-missing --cov-report=json:evidence/benchmarks/coverage.json"

[tool.coverage.run]
source = ["schemas", "src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
