name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check schemas src tests scripts
      - name: Ruff format check
        run: ruff format --check schemas src tests scripts
      - name: Mypy strict
        run: mypy schemas src tests
      - name: Pytest with coverage gate
        run: python -m pytest --cov=schemas --cov=src --cov-report=term-missing --cov-fail-under=90
